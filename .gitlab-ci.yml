# Setup and recovery: docs/gitlab-github-sync.md
sync_github_release:
  stage: deploy
  image: alpine:3.22
  tags: [linux]
  variables:
    GIT_DEPTH: '0'
  resource_group: github-release-sync
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$/'
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache git openssh-client
  script:
    - |
      set -eu
      set +x

      fail() {
        echo "ERROR: $*" >&2
        exit 1
      }

      [ -n "${GITHUB_SYNC_SSH_PRIVATE_KEY:-}" ] && [ -s "$GITHUB_SYNC_SSH_PRIVATE_KEY" ] ||
        fail 'GITHUB_SYNC_SSH_PRIVATE_KEY must be a nonempty GitLab File variable.'
      [ -n "${GITHUB_SYNC_SSH_KNOWN_HOSTS:-}" ] && [ -s "$GITHUB_SYNC_SSH_KNOWN_HOSTS" ] ||
        fail 'GITHUB_SYNC_SSH_KNOWN_HOSTS must be a nonempty GitLab File variable.'

      tag_ref="refs/tags/$CI_COMMIT_TAG"
      github_url='git@github.com:delight-software/n8n-nodes-delight.git'

      # Fetch only the source refs needed; HEAD remains detached at the pipeline commit.
      git fetch --no-tags origin \
        'refs/heads/main:refs/remotes/origin/main' "$tag_ref:$tag_ref"
      release_commit=$(git rev-parse --verify "$tag_ref^{commit}")
      [ "$release_commit" = "$CI_COMMIT_SHA" ] ||
        fail 'The source tag no longer matches the pipeline commit.'
      git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main ||
        fail 'The release tag is not in GitLab main history; check the branch push first.'

      umask 077
      ssh_dir=$(mktemp -d)
      trap 'rm -rf "$ssh_dir"' EXIT
      cp "$GITHUB_SYNC_SSH_PRIVATE_KEY" "$ssh_dir/id_ed25519"
      cp "$GITHUB_SYNC_SSH_KNOWN_HOSTS" "$ssh_dir/known_hosts"
      chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
      ssh-keygen -y -P '' -f "$ssh_dir/id_ed25519" >/dev/null ||
        fail 'The synchronization private key is invalid or requires a passphrase.'
      ssh-keygen -F github.com -f "$ssh_dir/known_hosts" >/dev/null ||
        fail 'The trusted known_hosts file has no entry for github.com.'
      export GIT_SSH_COMMAND="ssh -F /dev/null -i \"$ssh_dir/id_ed25519\" -o IdentitiesOnly=yes -o IdentityAgent=none -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=\"$ssh_dir/known_hosts\" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no"

      # The existing mirrored repository must have main. Do not hide missing refs or auth errors.
      git fetch --no-tags "$github_url" 'refs/heads/main:refs/remotes/github/main'
      git merge-base --is-ancestor refs/remotes/github/main refs/remotes/origin/main ||
        fail 'GitHub main is outside GitLab main history; reconcile it in GitLab before retrying.'

      if git merge-base --is-ancestor refs/remotes/github/main "$release_commit"; then
        set -- "$release_commit:refs/heads/main" "$tag_ref:$tag_ref"
        echo "Synchronizing release $CI_COMMIT_TAG at $release_commit to GitHub main."
      elif git merge-base --is-ancestor "$release_commit" refs/remotes/github/main; then
        # An older queued/retried pipeline may still deliver its tag, but cannot rewind main.
        set -- "$tag_ref:$tag_ref"
        echo "GitHub main already contains release $CI_COMMIT_TAG; synchronizing only its tag."
      else
        fail 'GitHub main and the release commit have divergent history.'
      fi

      # Atomic refs: a rejected branch/tag update must not leave a partial release.
      # Explicit refs and --no-follow-tags also exclude unrelated annotated tags.
      git push --atomic --no-follow-tags "$github_url" "$@"
